
name: Auto Renew Bot-hosting

on:
  # schedule:
  #   - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-24.04

    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb x11-utils xdotool scrot fonts-noto-cjk \
            curl jq ca-certificates

          python -m pip install --upgrade pip
          pip install seleniumbase "requests[socks]"
          seleniumbase install chromedriver

      # 官方 sing-box 安装及节点转换
      - name: ⚙ 设置官方 sing-box 代理
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          set +e

          # 默认关闭代理，确保任何失败都可以直连
          echo "IS_PROXY=false" >> "$GITHUB_ENV"
          echo "PROXY_SERVER=" >> "$GITHUB_ENV"

          cat > setup_singbox.py <<'PY'
          import os
          import sys
          import json
          import time
          import base64
          import tarfile
          import io
          import urllib.request
          import urllib.parse
          import subprocess
          import socket

          def log(msg):
              print("[sing-box] " + str(msg), flush=True)

          def download(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "GitHub-Actions"}
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read()

          def truth(value):
              return str(value).lower() in ("true", "1", "yes")

          def parse_node(link):
              link = link.strip()

              # VMess
              if link.startswith("vmess://"):
                  raw = link[8:]
                  raw += "=" * (-len(raw) % 4)
                  data = json.loads(
                      base64.urlsafe_b64decode(raw)
                  )

                  outbound = {
                      "type": "vmess",
                      "tag": "proxy",
                      "server": data["add"],
                      "server_port": int(data["port"]),
                      "uuid": data["id"],
                      "alter_id": int(data.get("aid", 0)),
                      "security": data.get("scy", "auto")
                  }

                  network = data.get("net", "tcp").lower()

                  if data.get("tls", "").lower() in ("tls", "true", "1"):
                      tls = {
                          "enabled": True,
                          "server_name": data.get("sni") or data.get("host", "")
                      }

                      if truth(data.get("allowInsecure", "false")):
                          tls["insecure"] = True

                      if data.get("fp"):
                          tls["utls"] = {
                              "enabled": True,
                              "fingerprint": data["fp"]
                          }

                      outbound["tls"] = tls

                  if network == "ws":
                      outbound["transport"] = {
                          "type": "ws",
                          "path": data.get("path", "/"),
                          "headers": {}
                      }
                      if data.get("host"):
                          outbound["transport"]["headers"]["Host"] = data["host"]

                  elif network == "grpc":
                      outbound["transport"] = {
                          "type": "grpc",
                          "service_name": data.get("path", "")
                      }

                  elif network == "httpupgrade":
                      outbound["transport"] = {
                          "type": "httpupgrade",
                          "path": data.get("path", "/")
                      }

                  elif network != "tcp":
                      raise ValueError("不支持的 VMess 传输类型：" + network)

                  return outbound

              parsed = urllib.parse.urlsplit(link)
              scheme = parsed.scheme.lower()
              params = urllib.parse.parse_qs(parsed.query)

              def get(key, default=""):
                  return params.get(key, [default])[0]

              server = parsed.hostname
              port = parsed.port

              if not server or not port:
                  raise ValueError("节点地址或端口无效")

              # VLESS
              if scheme == "vless":
                  uuid = urllib.parse.unquote(parsed.username or "")

                  if not uuid:
                      raise ValueError("VLESS 缺少 UUID")

                  outbound = {
                      "type": "vless",
                      "tag": "proxy",
                      "server": server,
                      "server_port": port,
                      "uuid": uuid
                  }

                  flow = get("flow")
                  if flow:
                      outbound["flow"] = flow

                  security = get("security", "none").lower()

                  if security in ("tls", "reality"):
                      tls = {
                          "enabled": True,
                          "server_name": get("sni") or get("serverName") or server
                      }

                      if truth(get("allowInsecure", "false")):
                          tls["insecure"] = True

                      if get("fp"):
                          tls["utls"] = {
                              "enabled": True,
                              "fingerprint": get("fp")
                          }

                      if security == "reality":
                          public_key = get("pbk")
                          if not public_key:
                              raise ValueError("REALITY 缺少 pbk 公钥")

                          tls["reality"] = {
                              "enabled": True,
                              "public_key": public_key,
                              "short_id": get("sid")
                          }

                      outbound["tls"] = tls

                  elif security != "none":
                      raise ValueError("不支持的 VLESS security：" + security)

                  network = get("type", "tcp").lower()

                  if network == "ws":
                      outbound["transport"] = {
                          "type": "ws",
                          "path": get("path", "/"),
                          "headers": {}
                      }
                      if get("host"):
                          outbound["transport"]["headers"]["Host"] = get("host")

                  elif network == "grpc":
                      outbound["transport"] = {
                          "type": "grpc",
                          "service_name": get("serviceName") or get("path")
                      }

                  elif network == "httpupgrade":
                      outbound["transport"] = {
                          "type": "httpupgrade",
                          "path": get("path", "/")
                      }

                  elif network != "tcp":
                      raise ValueError("不支持的 VLESS 传输类型：" + network)

                  return outbound

              # Hysteria2
              if scheme in ("hysteria2", "hy2"):
                  password = urllib.parse.unquote(
                      parsed.username or parsed.password or ""
                  )

                  if not password:
                      raise ValueError("HY2 缺少密码")

                  outbound = {
                      "type": "hysteria2",
                      "tag": "proxy",
                      "server": server,
                      "server_port": port,
                      "password": password,
                      "tls": {
                          "enabled": True,
                          "server_name": get("sni") or server
                      }
                  }

                  if truth(get("insecure", "false")):
                      outbound["tls"]["insecure"] = True

                  obfs = get("obfs")
                  if obfs:
                      outbound["obfs"] = {
                          "type": obfs,
                          "password": get("obfs-password")
                      }

                  return outbound

              raise ValueError("不支持的节点协议：" + scheme)

          def main():
              global proc
              proc = None

              link = os.environ.get("NODE_LINK", "").strip()

              if not link:
                  log("没有填写 NODE_LINK，自动使用直连")
                  return

              try:
                  # 获取官方最新稳定版本
                  log("正在获取官方 sing-box 版本")

                  api = json.loads(download(
                      "https://api.github.com/repos/SagerNet/sing-box/releases/latest"
                  ))

                  version = api["tag_name"].lstrip("v")
                  filename = f"sing-box-{version}-linux-amd64.tar.gz"

                  asset = next(
                      a for a in api["assets"]
                      if a["name"] == filename
                  )

                  archive = download(asset["browser_download_url"])

                  with tarfile.open(
                      fileobj=io.BytesIO(archive),
                      mode="r:gz"
                  ) as tf:
                      member = next(
                          m for m in tf.getmembers()
                          if m.isfile() and m.name.endswith("/sing-box")
                      )
                      binary = tf.extractfile(member).read()

                  with open("sing-box", "wb") as f:
                      f.write(binary)

                  os.chmod("sing-box", 0o755)

                  log("官方 sing-box 版本：" + version)

                  outbound = parse_node(link)

                  config = {
                      "log": {"level": "warn"},
                      "inbounds": [
                          {
                              "type": "socks",
                              "tag": "socks-in",
                              "listen": "127.0.0.1",
                              "listen_port": 1080,
                              "udp": True
                          }
                      ],
                      "outbounds": [
                          outbound,
                          {"type": "direct", "tag": "direct"}
                      ],
                      "route": {"final": "proxy"}
                  }

                  with open("sing-box-config.json", "w") as f:
                      json.dump(config, f, indent=2)

                  log("节点协议：" + outbound["type"])

                  # 官方配置检查
                  subprocess.run(
                      ["./sing-box", "check", "-c", "sing-box-config.json"],
                      check=True,
                      timeout=30
                  )

                  # 启动核心
                  log("正在启动 sing-box")

                  log_file = open("sing-box.log", "w")

                  proc = subprocess.Popen(
                      [
                          "./sing-box",
                          "run",
                          "-c",
                          "sing-box-config.json"
                      ],
                      stdout=log_file,
                      stderr=subprocess.STDOUT,
                      start_new_session=True
                  )

                  with open("sing-box.pid", "w") as f:
                      f.write(str(proc.pid))

                  # 检查 SOCKS5 端口
                  ready = False

                  for _ in range(20):
                      if proc.poll() is not None:
                          raise RuntimeError("sing-box 启动后退出")

                      try:
                          with socket.create_connection(
                              ("127.0.0.1", 1080),
                              timeout=1
                          ):
                              ready = True
                              break
                      except OSError:
                          time.sleep(1)

                  if not ready:
                      raise RuntimeError("SOCKS5 端口启动失败")

                  # 实际代理连通性检测
                  log("正在测试节点连接")

                  success = False

                  for attempt in range(3):
                      result = subprocess.run(
                          [
                              "curl",
                              "-fsS",
                              "--max-time", "20",
                              "--socks5-hostname",
                              "127.0.0.1:1080",
                              "https://api.ipify.org"
                          ],
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.DEVNULL
                      )

                      if result.returncode == 0:
                          success = True
                          break

                      time.sleep(3)

                  if not success:
                      raise RuntimeError("代理连通性测试失败")

                  # 仅成功时开启代理
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write("IS_PROXY=true\n")
                      f.write("PROXY_SERVER=socks5://127.0.0.1:1080\n")

                  log("代理连接成功，后续续期使用代理")

                  log_file.close()

              except Exception as e:
                  log("代理设置失败：" + str(e))
                  log("自动切换直连模式")

                  if proc is not None and proc.poll() is None:
                      try:
                          proc.terminate()
                          proc.wait(timeout=5)
                      except Exception:
                          proc.kill()

                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write("IS_PROXY=false\n")
                      f.write("PROXY_SERVER=\n")

          if __name__ == "__main__":
              main()
          PY

          python3 setup_singbox.py

      # app.py 自动读取 IS_PROXY 和 PROXY_SERVER
      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "代理状态：${IS_PROXY:-false}"
          echo "代理地址：${PROXY_SERVER:-直连}"

          xvfb-run --auto-servernum python3 app.py

      # 清理
      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          if [ -f sing-box.pid ]; then
            kill "$(cat sing-box.pid)" 2>/dev/null || true
          fi

          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true

          rm -f sing-box sing-box-config.json
          rm -f sing-box.log sing-box.pid setup_singbox.py

      # 更新时间文件
      - name: Commit time.txt to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "更新时间：$(date +'%Y-%m-%d %H:%M:%S')" > time.txt

          git add time.txt

          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ 更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD:main
          fi

      # 清理旧运行记录
      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list \
            --workflow="${{ github.workflow }}" \
            --limit=100 \
            --json databaseId \
            --jq '.[].databaseId')

          count=0

          for run_id in $runs; do
            count=$((count + 1))

            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete "$run_id" || true
            fi
          done
